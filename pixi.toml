[workspace]
channels = ["pytorch", "nvidia", "rapidsai", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"

[pypi-dependencies]
segger = { path = ".", editable = true }

[feature.cuda121.dependencies]
python = ">=3.11,<3.12"

[feature.cuda121.system-requirements]
cuda = "12"

[feature.cuda121.pypi-options]
index-strategy = "unsafe-best-match"
index-url = "https://pypi.org/simple"
extra-index-urls = [
    "https://pypi.nvidia.com",
    "https://download.pytorch.org/whl/cu121"
]

[feature.cuda121.pypi-dependencies]
torch = "==2.5.*"
torchvision = "==0.20.*"
lightning = "*"
torch_geometric = "*"
torch-scatter = { url = "https://github.com/dpeerlab/segger/releases/download/wheels-cu121-v1/torch_scatter-2.1.2%2Bpt25cu121-cp311-cp311-linux_x86_64.whl" }
torch-sparse = { url = "https://github.com/dpeerlab/segger/releases/download/wheels-cu121-v1/torch_sparse-0.6.18%2Bpt25cu121-cp311-cp311-linux_x86_64.whl" }
cuspatial-cu12 = "==24.10.*"
cudf-cu12 = "==24.10.*"
cuml-cu12 = "==24.10.*"
cugraph-cu12 = "==24.10.*"
cupy-cuda12x = ">=12.2,<13.0"

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]

[environments]
cuda121 = ["cuda121"]