[workspace]
channels = ["pytorch", "nvidia", "rapidsai", "conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = ">=3.11,<3.12"

[pypi-dependencies]
segger = { path = ".", editable = true }

# --- CUDA 12.1 feature ---

[feature.cuda121.pypi-options]
index-url = "https://pypi.org/simple"
extra-index-urls = ["https://download.pytorch.org/whl/cu121", "https://pypi.nvidia.com"]
find-links = [{ url = "https://data.pyg.org/whl/torch-2.5.0+cu121.html" }]

[feature.cuda121.pypi-dependencies]
torch = "==2.5.0"
torchvision = "==0.20.0"
torch_scatter = "*"
cuspatial-cu12 = "*"
cudf-cu12 = "*"
cuml-cu12 = "*"
cugraph-cu12 = "*"
cupy-cuda12x = "*"

[environments]
cuda121 = ["cuda121"]