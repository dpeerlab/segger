[workspace]
channels = ["pytorch", "nvidia", "rapidsai", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"

[pypi-dependencies]
segger = { path = ".", editable = true }

[feature.cuda121.dependencies]
python = ">=3.11,<3.12"

[feature.cuda121.system-requirements]
cuda = "12"

[feature.cuda121.pypi-options]
index-strategy = "unsafe-best-match"
index-url = "https://pypi.org/simple"
extra-index-urls = [
    "https://pypi.nvidia.com",
    "https://download.pytorch.org/whl/cu121"
]
find-links = [
    { url = "https://data.pyg.org/whl/torch-2.5.0+cu121.html" }
]

[feature.cuda121.pypi-dependencies]
torch = "==2.5.*"
torchvision = "==0.20.*"
lightning = "*"
torch_geometric = "*"
torch-scatter = "*"
torch-sparse = "*"
cuspatial-cu12 = "==24.10.*"
cudf-cu12 = "==24.10.*"
cuml-cu12 = "==24.10.*"
cugraph-cu12 = "==24.10.*"
cupy-cuda12x = ">=12.2,<13.0"
spatialdata = ">=0.4.0, <0.5"
setuptools = ">=81.0.0, <82"

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]

[environments]
cuda121 = ["cuda121"]
