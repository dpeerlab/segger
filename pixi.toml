[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.13,<3.14"
cuda-nvcc = "13.*"

[system-requirements]
cuda = "13"

[pypi-options]
index-strategy = "unsafe-best-match"
extra-index-urls = [
    "https://pypi.nvidia.com",
    "https://download.pytorch.org/whl/cu130"
]

[pypi-dependencies]
segger = { path = ".", editable = true }
