[workspace]
channels = ["conda-forge"]
platforms = [{ name = "linux-64", platform = "linux-64", cuda = "13" }]

[dependencies]
python = ">=3.13,<3.14"

[pypi-options]
index-strategy = "unsafe-best-match"
extra-index-urls = [
    "https://pypi.nvidia.com",
    "https://download.pytorch.org/whl/cu130"
]

[pypi-dependencies]
segger = { path = ".", editable = true }
