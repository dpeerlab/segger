[project]
name = "segger"
version = "0.1.0"
description = "Segmentation of spatial transcriptomics data"
authors = [
    {name = "Elyas Heidari", email = "elyas.heidari@dkfz-heidelberg.de"},
    {name = "Andrew Moorman", email = "moormana@mskcc.org"},
]
keywords = ["spatial-transcriptomics", "segmentation", "image-analysis"]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "anndata",
    "cyclopts",
    "geopandas",
    "numba",
    "numpy",
    "opencv-python",
    "pandas",
    "polars",
    "pyarrow",
    "scanpy",
    "scipy",
    "shapely",
    "scikit-image",
    "scikit-learn",
    "tifffile"
]

[project.optional-dependencies]
# CPU Leiden parity for fragment mode (Stage B). Optional: when absent, fragment
# mode falls back to the numpy `_threshold_cut` splitter. GPU paths (cuGraph
# Leiden / cuML) and the HDBSCAN backend (sklearn.cluster.HDBSCAN, already a core
# dep) need nothing extra here.
cluster = [
    "leidenalg>=0.10",
    "python-igraph>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/segger"]

[project.scripts]
segger = "segger.cli.main:app"