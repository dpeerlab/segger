[project]
name = "segger"
version = "0.3.0"
description = "Segmentation of spatial transcriptomics data"
authors = [
    {name = "Elyas Heidari", email = "elyas.heidari@dkfz-heidelberg.de"},
    {name = "Andrew Moorman", email = "moormana@mskcc.org"},
]
keywords = ["spatial-transcriptomics", "segmentation", "image-analysis"]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "anndata",
    "cyclopts",
    "dask",
    "fastquadtree",
    "geopandas",
    "numba",
    "numpy",
    "opencv-python",
    "pandas",
    "polars",
    "pyarrow",
    "scanpy",
    "scipy",
    "shapely",
    "scikit-image",
    "scikit-learn",
    "tifffile",
    "tqdm",
    # CUDA 13 GPU stack (incl. cuspa)
    "torch==2.14.*",
    "torchvision",
    "lightning",
    "torch_geometric",
    "cuspa @ git+https://github.com/NVIDIA/cuspa",
    "cudf-cu13",
    "cuml-cu13",
    "cugraph-cu13",
    "cupy-cuda13x",
    "rmm-cu13",
]

[project.optional-dependencies]
spatialdata = ["spatialdata"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/segger"]

[project.scripts]
segger = "segger.cli.main:app"

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
