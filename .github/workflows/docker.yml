# Build the segger Docker image and push it to Docker Hub on every version tag.

name: Docker image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/segger

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      # torch + RAPIDS wheels need more space than a fresh runner has free
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.0.0 → 1.0.0 + latest, v1.1.0rc1 → 1.1.0rc1 (pre-releases skip latest)
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=pep440,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
